# Netlify configuration for the K Roadtech Next.js site.
#
# Next.js 13.5+ is detected automatically and the Next.js Runtime
# (@netlify/plugin-nextjs) is installed and updated by Netlify on every
# build, so the plugin version is intentionally NOT pinned in package.json.
# Deploy: push this repo to a Git provider, then "Add new site" in Netlify.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node.js 20.9+ — pin a current LTS for reproducible builds.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-lived cache for Next.js hashed static assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sensible security defaults for all pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
